<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Moa · 多模型协作问答</title>
<link rel="icon" href="data:,">
<script src="/static/marked.min.js"></script>
<style>
:root {
  --bg: #0f1117; --panel: #171a23; --panel2: #1d2130; --border: #2a2f42;
  --text: #e6e9f0; --muted: #8b93a7; --accent: #6c8cff; --ok: #4ade80; --err: #f87171; --warn: #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }

header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
header h1 { font-size: 17px; font-weight: 600; }
header h1 span { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
.badge { font-size: 11px; padding: 2px 10px; border-radius: 10px; background: var(--panel2); color: var(--muted); }
.spacer { flex: 1; }
button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: not-allowed; }
input[type=text], input[type=password], select, textarea {
  background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

/* 主界面: 编组条 */
#model-bar { display: flex; gap: 10px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
.slot { display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 5px 8px; }
.slot .s-vendor { font-size: 12px; color: var(--muted); min-width: 64px; }
.slot select { border: none; background: transparent; padding: 2px 4px; font-size: 13px; max-width: 220px; color: var(--text); }
.slot select option { background: var(--panel2); color: var(--text); }
select option, select optgroup { background: #1d2130; color: #e6e9f0; }
.slot select:focus { border: none; }
.effort-sel { border: 1px solid var(--border); background: var(--panel2); color: var(--text); border-radius: 6px; padding: 2px 4px; font-size: 11px; }
.slot .s-del { padding: 0 5px; font-size: 14px; color: var(--muted); background: none; border: none; }
.slot .s-del:hover { color: var(--err); }
.think-toggle { display: flex; align-items: center; gap: 3px; font-size: 12px; cursor: pointer; user-select: none; }
.think-toggle input { accent-color: var(--accent); }
.think-toggle.dis { opacity: .3; pointer-events: none; }
#search-toggle-wrap { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
#search-toggle-wrap input { accent-color: var(--accent); }

#columns { flex: 1; overflow-y: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px; padding: 14px 18px; }
.col { flex: 1 1 300px; min-width: 280px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; min-height: 200px; max-height: 70vh; }
#columns.many .col { flex: 1 1 220px; min-width: 200px; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; flex-wrap: wrap; }
.col-head b { font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.dot.streaming { background: var(--accent); animation: pulse 1s infinite; }
.dot.done { background: var(--ok); }
.dot.error { background: var(--err); }
@keyframes pulse { 50% { opacity: .4; } }
.col-meta { margin-left: auto; font-size: 11px; color: var(--muted); }
.col-body { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 13px; line-height: 1.7; word-break: break-word; }
.col-body .answer-text { white-space: pre-wrap; }
.col-body.render-md .answer-text { white-space: normal; }
.thinking-block { background: var(--panel2); border: 1px dashed var(--border); border-radius: 8px; margin-bottom: 10px; padding: 8px 10px; }
.thinking-block summary { cursor: pointer; font-size: 11px; color: var(--muted); }
.thinking-block .t-content { font-size: 11.5px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
.col.summary { border-color: var(--accent); flex-basis: 100% !important; max-width: 100% !important; min-height: 260px; max-height: 80vh; order: 99; margin-top: 6px; }
.col.summary .col-head { font-size: 14px; padding: 12px 16px; }
.col.summary .col-body { font-size: 14.5px; line-height: 1.8; padding: 16px 20px; }
.col.summary .col-head b::before { content: "🎯 "; }
.col-body pre { background: var(--bg); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
.col-body code { font-family: Consolas, monospace; font-size: 12px; }
.col-body table { border-collapse: collapse; margin: 8px 0; }
.col-body th, .col-body td { border: 1px solid var(--border); padding: 4px 8px; font-size: 12px; }
.col.error .col-body { color: var(--err); font-size: 12px; }
.search-banner { flex-basis: 100%; font-size: 11px; color: var(--muted); background: var(--panel2); border-radius: 8px; padding: 6px 12px; }
.search-banner details summary { cursor: pointer; }

footer { display: flex; gap: 10px; padding: 12px 18px; background: var(--panel); border-top: 1px solid var(--border); }
footer textarea { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: inherit; resize: none; outline: none; }
footer textarea:focus { border-color: var(--accent); }
footer .primary { align-self: flex-end; height: 42px; padding: 0 22px; }

/* 设置弹窗 */
#modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 100; }
#modal-mask.show { display: flex; }
#modal-box { width: min(720px, 94vw); max-height: 88vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px 24px; }
#modal-box h2 { font-size: 16px; margin-bottom: 4px; }
#modal-box hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.vendor-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.vendor-row:last-of-type { border-bottom: none; }
.vendor-row .v-name { min-width: 150px; font-size: 13px; }
.vendor-row .v-name .sub { font-size: 10px; color: var(--muted); }
.vendor-row input[type=password] { flex: 1; min-width: 180px; }
.vendor-row .v-test { padding: 4px 10px; font-size: 11px; }
.v-light { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.v-light.ok { background: var(--ok); }
.v-light.bad { background: var(--err); }
.v-result { flex-basis: 100%; font-size: 11px; color: var(--muted); padding-left: 160px; }
.v-result.err { color: var(--err); }
.v-result.okk { color: var(--ok); }
.sec-title { font-size: 13px; font-weight: 600; margin: 12px 0 6px; color: var(--accent); }
.hint { font-size: 11px; color: var(--muted); }
.adv-details { margin-top: 10px; }
.adv-details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
#custom-vendor-form { display: grid; grid-template-columns: 90px 1fr; gap: 8px; margin-top: 10px; font-size: 12px; }
#custom-vendor-form label { color: var(--muted); align-self: center; }
.cv-row { display: flex; gap: 6px; }
.cv-result { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>Moa <span>· 多模型协作问答</span></h1>
  <span class="badge" id="status-badge">未开始</span>
  <div class="spacer"></div>
  <button id="btn-settings">⚙ 设置</button>
</header>

<div id="model-bar">
  <div id="slots"></div>
  <button id="btn-add-slot" style="padding:4px 12px;font-size:12px;">+ 模型</button>
  <div class="spacer"></div>
  <label id="search-toggle-wrap" title="所有子模型将基于同一份搜索资料作答">
    <input type="checkbox" id="search-toggle"> 🌐 联网
  </label>
</div>

<div id="columns"></div>

<footer>
  <textarea id="question" rows="3" placeholder="输入你的问题,分发给多个模型… (Enter 发送, Shift+Enter 换行)"></textarea>
  <button class="primary" id="btn-ask">发送</button>
</footer>

<!-- Settings Modal -->
<div id="modal-mask">
  <div id="modal-box">
    <div style="display:flex; align-items:center; margin-bottom:6px;">
      <h2 style="flex:1;">设置</h2>
      <button id="btn-close-modal">✕</button>
    </div>
    <p class="hint">粘贴 API Key 即用。厂商端点与模型列表来自 models.dev 社区数据库,自动更新。</p>

    <div class="sec-title">厂商 API Key</div>
    <div id="vendor-list"></div>

    <hr>
    <div class="sec-title">联网搜索源</div>
    <div class="vendor-row">
      <div class="v-name">Anysearch <div class="sub">质量优先,中文友好</div></div>
      <input type="password" id="anysearch-key" placeholder="粘贴 Anysearch API Key(留空用免费源)">
      <button class="v-test" id="btn-search-test">测试</button>
      <span class="v-light" id="search-light"></span>
      <div class="v-result" id="search-result"></div>
    </div>

    <hr>
    <details class="adv-details">
      <summary>高级:自定义供应商 / 主模型 / 汇总提示词</summary>
      <div class="sec-title" style="margin-top:10px;">自定义供应商 (OpenAI 兼容)</div>
      <div id="custom-vendor-list"></div>
      <div id="custom-vendor-form">
        <label>显示名</label><input type="text" id="cv-label" placeholder="我的中转站">
        <label>Base URL</label><input type="text" id="cv-url" placeholder="https://xxx/v1">
        <label>API Key</label><input type="password" id="cv-key" placeholder="sk-...">
        <label>模型列表</label>
        <div class="cv-row">
          <input type="text" id="cv-models" placeholder="点「拉取」自动填充,或手输逗号分隔">
          <button id="btn-cv-fetch" style="padding:4px 10px;font-size:11px;white-space:nowrap;">拉取</button>
        </div>
        <label></label>
        <div class="cv-row"><button id="btn-cv-add" style="padding:5px 14px;">+ 添加</button><span class="cv-result" id="cv-result"></span></div>
      </div>
      <div class="sec-title" style="margin-top:14px;">主模型(汇总)</div>
      <select id="main-model" style="width:100%;"></select>
      <div style="margin-top:10px;">
        <div style="display:flex;align-items:center;margin-bottom:6px;">
          <span style="font-size:13px;flex:1;">汇总提示词:</span>
          <button id="btn-reset-prompt" style="padding:3px 10px;font-size:11px;">恢复默认</button>
        </div>
        <textarea id="summary-prompt" rows="6" placeholder="留空用默认(视角融合式)。"
          style="width:100%;resize:vertical;"></textarea>
      </div>
    </details>

    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="primary" id="btn-save-all">保存</button>
    </div>
  </div>
</div>

<script>
const S = { vendors: {}, main: null, cols: new Map(), slots: [] };
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// ================================================== 模型编组条
function renderSlots() {
  const el = $("#slots");
  el.innerHTML = "";
  for (const slot of S.slots) {
    const d = document.createElement("div");
    d.className = "slot";
    const v = S.vendors[slot.pid] || {models: {}};
    const canThink = !!(v.models[slot.model] || {}).reasoning;
    const opts = Object.entries(v.models).map(([mid, m]) =>
      `<option value="${esc(mid)}" ${mid === slot.model ? "selected" : ""}>${esc(m.label || mid)}${m.reasoning ? " 🧠" : ""}</option>`
    ).join("");
    d.innerHTML = `
      <span class="s-vendor">${esc(v.label || slot.pid)}</span>
      <select class="s-model">${opts}</select>
      <label class="think-toggle ${canThink ? "" : "dis"}" title="${canThink ? "思考过程" : "该模型不支持思考"}">
        <input type="checkbox" class="s-think" ${slot.thinking ? "checked" : ""} ${canThink ? "" : "disabled"}>🧠
      </label>
      <select class="effort-sel" class-extra="" title="思考等级" style="${slot.thinking && canThink ? "" : "display:none"}">
        <option value="" ${!slot.effort ? "selected" : ""}>默认</option>
        <option value="low" ${slot.effort === "low" ? "selected" : ""}>低</option>
        <option value="medium" ${slot.effort === "medium" ? "selected" : ""}>中</option>
        <option value="high" ${slot.effort === "high" ? "selected" : ""}>高</option>
      </select>
      <button class="s-del" title="移除">✕</button>
    `;
    const effortSel = d.querySelector(".effort-sel");
    d.querySelector(".s-model").onchange = e => {
      slot.model = e.target.value;
      const nowCan = !!(v.models[slot.model] || {}).reasoning;
      slot.thinking = nowCan && slot.thinking;
      renderSlots(); saveLS();
    };
    d.querySelector(".s-think").onchange = e => {
      slot.thinking = e.target.checked;
      effortSel.style.display = (slot.thinking && canThink) ? "" : "none";
      saveLS();
    };
    effortSel.onchange = e => { slot.effort = e.target.value || null; saveLS(); };
    d.querySelector(".s-del").onclick = () => {
      S.slots = S.slots.filter(x => x !== slot);
      renderSlots(); saveLS();
    };
    el.appendChild(d);
  }
}

function addSlot(pid, model, thinking) {
  const hasKey = S.vendors[pid] && S.vendors[pid].has_key;
  if (!hasKey) { alert(`「${(S.vendors[pid]||{}).label || pid}」还没贴 key,请先到设置里配置`); return; }
  S.slots.push({pid, model, thinking: !!thinking});
  renderSlots(); saveLS();
}

$("#btn-add-slot").onclick = () => {
  // 弹出厂商选择菜单
  const withKey = Object.entries(S.vendors).filter(([pid, v]) => v.has_key);
  if (!withKey.length) { alert("没有已配 key 的厂商,请先到设置里贴 key"); return; }
  // 小型下拉菜单: 选厂商
  const menu = document.createElement("div");
  menu.style.cssText = "position:fixed;z-index:9999;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-height:320px;overflow-y:auto;";
  const btnRect = $("#btn-add-slot").getBoundingClientRect();
  menu.style.left = btnRect.left + "px";
  menu.style.top = (btnRect.bottom + 6) + "px";
  for (const [pid, v] of withKey) {
    const item = document.createElement("div");
    item.textContent = v.label || pid;
    item.style.cssText = "padding:7px 14px;cursor:pointer;font-size:13px;border-radius:6px;";
    item.onmouseenter = () => item.style.background = "var(--panel)";
    item.onmouseleave = () => item.style.background = "";
    item.onclick = async () => {
      menu.remove();
      // 拉该厂商 live 合并模型列表
      let models = v.models || {};
      try {
        const r = await fetch("/api/vendor_models", {method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({pid})});
        const j = await r.json();
        if (j.ok && j.models) {
          models = j.models;
          S.vendors[pid].models = models;  // 缓存供后续槽位用
        }
      } catch {}
      const first = Object.keys(models)[0];
      if (!first) { alert("该厂商模型列表为空"); return; }
      addSlot(pid, first, !!(models[first] || {}).reasoning);
    };
    menu.appendChild(item);
  }
  document.body.appendChild(menu);
  const close = e => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener("mousedown", close); } };
  setTimeout(() => document.addEventListener("mousedown", close), 0);
};

function saveLS() {
  localStorage.setItem("moa_slots", JSON.stringify({
    slots: S.slots, search: $("#search-toggle").checked
  }));
}
function loadLS() {
  try {
    const d = JSON.parse(localStorage.getItem("moa_slots") || "{}");
    if (Array.isArray(d.slots)) S.slots = d.slots.filter(s => s && s.pid && s.model);
    $("#search-toggle").checked = !!d.search;
  } catch {}
}

// ================================================== 设置弹窗
async function openSettings() {
  await refreshVendors();
  renderVendorList(); renderCustomVendors(); renderMainSelect();
  $("#modal-mask").classList.add("show");
}
function closeSettings() { $("#modal-mask").classList.remove("show"); }

async function refreshVendors() {
  const r = await fetch("/api/vendors");
  const j = await r.json();
  S.vendors = j.vendors; S.main = j.main;
  S.defaultSummaryPrompt = j.default_summary_prompt || "";
  $("#summary-prompt").value = j.summary_prompt || "";
  $("#anysearch-key").value = (j.search || {}).anysearch_key ? "已配置(重输覆盖)" : "";
  $("#anysearch-key").dataset.has = (j.search || {}).anysearch_key ? "1" : "";
}

function renderVendorList() {
  const el = $("#vendor-list");
  el.innerHTML = "";
  const entries = Object.entries(S.vendors).filter(([pid, v]) => !v.custom);
  for (const [pid, v] of entries) {
    const d = document.createElement("div");
    d.className = "vendor-row";
    d.dataset.pid = pid;
    const nModels = Object.keys(v.models || {}).length;
    d.innerHTML = `
      <span class="v-light ${v.has_key ? "ok" : ""}"></span>
      <div class="v-name">${esc(v.label)}<div class="sub">${nModels} 模型${v.has_key ? " · 已配key" : ""}</div></div>
      <input type="password" class="v-key" placeholder="${v.has_key ? v.key_mask + " (重输覆盖)" : "粘贴 API Key"}">
      <button class="v-test">测试</button>
      <div class="v-result"></div>
    `;
    const keyInput = d.querySelector(".v-key");
    keyInput.onchange = async () => {
      const key = keyInput.value.trim();
      if (!key) return;
      await fetch("/api/keys", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({pid, api_key: key})});
      await refreshVendors(); renderVendorList();
    };
    d.querySelector(".v-test").onclick = async () => {
      const rEl = d.querySelector(".v-result");
      const light = d.querySelector(".v-light");
      const firstModel = Object.keys(v.models)[0];
      rEl.textContent = "测试中…"; rEl.className = "v-result";
      const key = keyInput.value.trim() || undefined;
      const resp = await fetch("/api/probe", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({pid, api_key: key, model: firstModel,
                              thinking: !!(v.models[firstModel] || {}).reasoning})});
      const j = await resp.json();
      light.className = "v-light " + (j.ok ? "ok" : "bad");
      let txt = (j.ok ? "✓ " : "✗ ") + j.detail;
      // 显示可用模型(live 拉到的)
      if (j.models && j.models.length) {
        const show = j.models.slice(0, 12).join(", ");
        txt += ` | 可用模型(${j.models.length}): ${show}${j.models.length > 12 ? " …" : ""}`;
      }
      rEl.textContent = txt;
      rEl.className = "v-result " + (j.ok ? "okk" : "err");
    };
    // 清除 key 按钮
    const clearBtn = document.createElement("button");
    clearBtn.className = "v-test";
    clearBtn.textContent = "清除";
    clearBtn.style.display = v.has_key ? "" : "none";
    clearBtn.onclick = async () => {
      if (!confirm(`确认清除「${v.label}」的 API Key?`)) return;
      await fetch("/api/keys", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({pid, api_key: ""})});
      await refreshVendors(); renderVendorList();
    };
    d.querySelector(".v-test").after(clearBtn);
    el.appendChild(d);
  }
}

function renderCustomVendors() {
  const el = $("#custom-vendor-list");
  el.innerHTML = "";
  for (const [cid, cv] of Object.entries(S.vendors).filter(([, v]) => v.custom)) {
    const d = document.createElement("div");
    d.className = "vendor-row";
    const nModels = Object.keys(cv.models || {}).length;
    d.innerHTML = `
      <span class="v-light ${cv.has_key ? "ok" : ""}"></span>
      <div class="v-name">${esc(cv.label)}<div class="sub">自定义 · ${nModels} 模型</div></div>
      <input type="password" class="v-key" placeholder="${cv.has_key ? cv.key_mask + " (重输覆盖)" : "粘贴 API Key"}">
      <button class="cv-del" style="padding:4px 10px;font-size:11px;">删除</button>
      <div class="v-result"></div>
    `;
    d.querySelector(".v-key").onchange = async () => {
      const key = d.querySelector(".v-key").value.trim();
      if (!key) return;
      await fetch("/api/keys", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({pid: cid, api_key: key})});
      await refreshVendors(); renderCustomVendors();
    };
    d.querySelector(".cv-del").onclick = async () => {
      await fetch("/api/custom_vendors", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({action: "remove", vendor: {id: cid}})});
      await refreshVendors(); renderCustomVendors();
    };
    el.appendChild(d);
  }
}

$("#btn-cv-fetch").onclick = async () => {
  const rEl = $("#cv-result");
  rEl.textContent = "拉取中…";
  const resp = await fetch("/api/fetch_models", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({base_url: $("#cv-url").value.trim(), api_key: $("#cv-key").value.trim()})});
  const j = await resp.json();
  if (j.ok) {
    $("#cv-models").value = j.models.join(",");
    rEl.textContent = `✓ 拉到 ${j.models.length} 个模型`;
    rEl.style.color = "var(--ok)";
  } else {
    rEl.textContent = "✗ " + j.error;
    rEl.style.color = "var(--err)";
  }
};

$("#btn-cv-add").onclick = async () => {
  const label = $("#cv-label").value.trim();
  const url = $("#cv-url").value.trim();
  const key = $("#cv-key").value.trim();
  let modelsRaw = $("#cv-models").value.trim();
  if (!label || !url || !modelsRaw) { $("#cv-result").textContent = "请填显示名/Base URL/模型"; return; }
  const models = {};
  modelsRaw.split(",").map(x => x.trim()).filter(Boolean).forEach(m => { models[m] = {label: m, reasoning: false}; });
  const resp = await fetch("/api/custom_vendors", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({action: "add", vendor: {label, base_url: url, models}})});
  const j = await resp.json();
  if (j.ok && key) {
    await fetch("/api/keys", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({pid: j.id, api_key: key})});
  }
  $("#cv-result").textContent = j.ok ? "✓ 已添加" : "✗ " + (j.error || "失败");
  await refreshVendors(); renderCustomVendors(); renderMainSelect();
};

function renderMainSelect() {
  const sel = $("#main-model");
  sel.innerHTML = '<option value="">(不指定主模型)</option>';
  const mainKey = Array.isArray(S.main) ? JSON.stringify(S.main) : "";
  for (const [pid, v] of Object.entries(S.vendors)) {
    if (!v.has_key) continue;
    for (const [mid, m] of Object.entries(v.models)) {
      const o = document.createElement("option");
      o.value = JSON.stringify([pid, mid]);
      o.textContent = `${v.label} / ${m.label || mid}`;
      if (o.value === mainKey) o.selected = true;
      sel.appendChild(o);
    }
  }
}

$("#btn-search-test").onclick = async () => {

  rEl.textContent = "测试中…";
  // 先保存 key(若输入了)
  const keyVal = $("#anysearch-key").value.trim();

async function apiSave(body) {
  await fetch("/api/save", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)});
}

$("#btn-save-all").onclick = async () => {
  const mainVal = $("#main-model").value;
  await apiSave({
    main: mainVal ? JSON.parse(mainVal) : null,
    summary_prompt: $("#summary-prompt").value,
  });

$("#btn-reset-prompt").onclick = () => { $("#summary-prompt").value = S.defaultSummaryPrompt || ""; };

// ================================================== 提问
async function ask() {
  const q = $("#question").value.trim();
  if (!q) return;
  if (!S.slots.length) { alert("请先在上方添加至少一个模型"); return; }
  const body = {
    question: q,
    models: S.slots.map(s => ({pid: s.pid, model: s.model,
                                thinking: s.thinking, effort: s.effort || null})),
    search: $("#search-toggle").checked,
  };
  const savedMain = S.main;
  if (savedMain) body.main = savedMain;

  $("#status-badge").textContent = "运行中…";
  const cols = $("#columns");
  cols.innerHTML = ""; S.cols.clear();
  buildColumns();
  cols.classList.toggle("many", S.slots.length >= 4);
  $("#question").value = "";
  const summaryThere = !!savedMain;

  try {
    const resp = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx); buf = buf.slice(idx + 1);
        if (line.trim()) handleLine(line);
      }
    }
  } catch (e) {
    $("#status-badge").textContent = "请求失败";
    alert("请求失败: " + e.message);
  }
}

function buildColumns() {
  for (const s of S.slots) {
    const v = S.vendors[s.pid] || {};
    addColumn(`${s.pid}/${s.model}`, false,
      `${v.label || s.pid} · ${(v.models[s.model] || {}).label || s.model}${s.thinking ? " 🧠" : ""}`);
  }
  if (S.main) addColumn("__summary__", true, "主模型汇总");
}

function addColumn(tag, isSummary, name) {
  const col = document.createElement("div");
  col.className = "col" + (isSummary ? " summary" : "");
  col.innerHTML = `
    <div class="col-head">
      <span class="dot"></span><b>${esc(name)}</b>
      <span class="col-meta"></span>
    </div>
    <div class="col-body"></div>
  `;
  $("#columns").appendChild(col);
  S.cols.set(tag, {
    el: col, dot: col.querySelector(".dot"), meta: col.querySelector(".col-meta"),
    body: col.querySelector(".col-body"), text: "", thinking: "", rendered: false,
  });
}

function renderAnswer(c) {
  const t = c.thinking
    ? `<details class="thinking-block"><summary>💭 思考过程 (${c.thinking.length}字)</summary><div class="t-content">${esc(c.thinking)}</div></details>` : "";
  const md = window.marked ? marked.parse(c.text) : esc(c.text);
  c.body.innerHTML = t + `<div class="answer-text">${md}</div>`;
  c.body.classList.add("render-md");
  c.body.scrollTop = c.body.scrollHeight;
}

function handleLine(line) {
  let ev;
  try { ev = JSON.parse(line); } catch { return; }
  const kind = ev.event;
  const c = S.cols.get(ev.tag || "__summary__");

  if (kind === "search_start") {
    $("#status-badge").textContent = "联网搜索中…";
  } else if (kind === "search_done") {
    if (ev.chars > 0) {
      const b = document.createElement("div");
      b.className = "search-banner";
      b.textContent = `🌐 已注入搜索资料 ${ev.chars} 字(所有模型基于同一材料作答)`;
      $("#columns").prepend(b);
    }
  } else if (kind === "delta") {
    if (!c) return;
    c.text += ev.text;
    let at = c.body.querySelector(".answer-text");
    if (!at) {
      at = document.createElement("div"); at.className = "answer-text";
      c.body.appendChild(at);
    }
    at.textContent = c.text;
    c.body.scrollTop = c.body.scrollHeight;
  } else if (kind === "thinking") {
    if (!c) return;
    c.thinking += ev.text;
    let tb = c.body.querySelector(".thinking-block");
    if (!tb) {
      tb = document.createElement("details");
      tb.className = "thinking-block"; tb.open = true;
      tb.innerHTML = `<summary>💭 思考中…</summary><div class="t-content"></div>`;
      c.body.prepend(tb);
    }
    tb.querySelector(".t-content").textContent = c.thinking;
    tb.querySelector("summary").textContent = `💭 思考中… (${c.thinking.length}字)`;
    c.body.scrollTop = c.body.scrollHeight;
  } else if (kind === "start") {
    if (c) { c.dot.className = "dot streaming"; c.meta.textContent = "生成中…"; }
  } else if (kind === "retry") {
    if (c) { c.dot.className = "dot"; c.meta.textContent = `重试 ${ev.attempt}(等${ev.wait}s)`; }
  } else if (kind === "done") {
    if (c) {
      c.dot.className = "dot done";
      c.meta.textContent = `${ev.chars}字${ev.thinking_chars ? " · 思考" + ev.thinking_chars + "字" : ""} · ${ev.elapsed}s`;
      renderAnswer(c);
    }
  } else if (kind === "error") {
    if (c) {
      c.dot.className = "dot error";
      c.meta.textContent = `失败 (${ev.elapsed || "?"}s)`;
      c.body.textContent = "❌ " + ev.message;
      c.el.classList.add("error");
    }
  } else if (kind === "summary_start") {
    const sc = S.cols.get("__summary__");
    if (!sc) return;
    sc.dot.className = "dot streaming"; sc.meta.textContent = "汇总中…";
  } else if (kind === "summary_thinking") {
    const sc = S.cols.get("__summary__");
    if (!sc) return;
    sc.thinking += ev.text;
    let tb = sc.body.querySelector(".thinking-block");
    if (!tb) {
      tb = document.createElement("details");
      tb.className = "thinking-block"; tb.open = false;
      tb.innerHTML = `<summary>💭 思考</summary><div class="t-content"></div>`;
      sc.body.prepend(tb);
    }
    tb.querySelector(".t-content").textContent = sc.thinking;
  } else if (kind === "summary_delta") {
    const sc = S.cols.get("__summary__");
    if (!sc) return;
    sc.text += ev.text;
    let at = sc.body.querySelector(".answer-text");
    if (!at) {
      at = document.createElement("div"); at.className = "answer-text";
      sc.body.appendChild(at);
    }
    at.textContent = sc.text;
    sc.body.scrollTop = sc.body.scrollHeight;
  } else if (kind === "summary_done") {
    const sc = S.cols.get("__summary__");
    if (sc) { sc.dot.className = "dot done"; sc.meta.textContent = "完成"; renderAnswer(sc); }
    $("#status-badge").textContent = "完成";
  } else if (kind === "summary_error") {
    const sc = S.cols.get("__summary__");
    if (sc) { sc.dot.className = "dot error"; sc.body.textContent = "❌ 汇总失败: " + ev.message; }
    $("#status-badge").textContent = "完成(汇总失败)";
  } else if (kind === "summary_skipped") {
    $("#status-badge").textContent = "完成";
  } else if (kind === "fatal") {
    $("#status-badge").textContent = "异常: " + (ev.message || "");
  } else if (kind === "all_done") {
    if ($("#status-badge").textContent === "运行中…") $("#status-badge").textContent = "完成";
  }
}

$("#btn-settings").onclick = openSettings;

(async () => {
  await refreshVendors();
  loadLS();
  // 清掉已失效的 slot(key被删/厂商没了/模型不在列表里->自动换第一个可用模型)
  S.slots = S.slots.filter(s => S.vendors[s.pid] && S.vendors[s.pid].has_key);
  for (const s of S.slots) {
    const models = (S.vendors[s.pid] || {}).models || {};
    if (!models[s.model]) {
      const first = Object.keys(models)[0];
      if (first) s.model = first;
    }
  }
  renderSlots();
})();
